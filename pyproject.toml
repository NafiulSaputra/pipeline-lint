[project]
name = "pipeline-lint"
version = "0.1.0.dev0"
description = "Data pipeline linter for SQL, PySpark, Databricks and Airflow. Catches non-idempotent writes, duplicate data on rerun, and other mistakes AI-generated pipelines make."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Nafiul Hadi Saputra" }]
keywords = ["linter", "data-engineering", "pyspark", "databricks", "airflow", "sql", "idempotency"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "rich>=13.7",
    "typer>=0.12",
]

[project.scripts]
pipeline-lint = "pipeline_lint.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline_lint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
# Fixtures and examples intentionally contain flawed pipeline code.
extend-exclude = ["tests/fixtures", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
