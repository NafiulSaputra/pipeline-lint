[project]
name = "pipeline-lint"
version = "0.1.0.dev0"
description = "Data pipeline linter for SQL, PySpark, Databricks and Airflow. Catches non-idempotent writes, duplicate data on rerun, and other mistakes AI-generated pipelines make."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Nafiul Saputra" }]
keywords = ["linter", "data-engineering", "pyspark", "databricks", "airflow", "sql", "idempotency"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "rich>=13.7",
    "sqlglot>=30.0,<31",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/NafiulSaputra/pipeline-lint"
Documentation = "https://github.com/NafiulSaputra/pipeline-lint#readme"
Issues = "https://github.com/NafiulSaputra/pipeline-lint/issues"
Changelog = "https://github.com/NafiulSaputra/pipeline-lint/blob/main/CHANGELOG.md"

[project.scripts]
pipeline-lint = "pipeline_lint.cli:app"

[dependency-groups]
dev = [
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline_lint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["pipeline_lint"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
# Fixtures and examples intentionally contain flawed pipeline code.
extend-exclude = ["tests/fixtures", "examples"]
# Respect the excludes above even when pre-commit passes those files explicitly.
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# pipeline-lint's own codes, so "# noqa: DE001" comments are not reported as unknown.
external = ["DE"]

[tool.pipeline-lint]
# The fixtures contain intentional violations; the examples are left in on purpose as a demo.
exclude = ["tests/fixtures/**"]
